# 06 — Worker opens the Documents screen and starts an upload
# The upload itself opens the system DocumentPicker which Maestro
# cannot reliably script across devices, so this flow asserts the
# upload UI is reachable and that tapping "Upload file" launches the
# picker. Picking is left to a manual / instrumented harness.
appId: com.jd12345.MobileApp
---
- runFlow: 01-worker-login.yaml

# Navigate via More → "📄 Documents".
- tapOn:
    text: "More"
- waitForAnimationToEnd
- tapOn:
    text: "Documents"
- waitForAnimationToEnd

- assertVisible: "My Documents"
- assertVisible: "Document type"

# Switch to "Work Permit" then back to "Passport" to prove the
# chip selector is wired up.
- tapOn:
    text: "Work Permit"
- assertVisible: "Work Permit"
- tapOn:
    text: "Passport"

# Tile grid for each doc type renders ("✅ Uploaded" or "⚠️ Missing").
- assertVisible: "Missing|Uploaded"

# Tap Upload to launch the system picker. We do not pick a file
# (that would require seeded gallery content); the picker overlay
# opening is enough to prove the flow is wired.
- tapOn:
    text: "Upload file"
- waitForAnimationToEnd

# Either the system picker opens (out-of-app) OR the back-navigation
# returns us to the Documents screen. Pressing back is safe.
- pressKey: Back
- waitForAnimationToEnd
- assertVisible: "My Documents"
