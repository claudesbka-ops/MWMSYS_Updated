# TC-M-01a — Worker login → reach the Home dashboard
appId: com.jd12345.MobileApp
---
- launchApp

- runFlow:
    when:
      visible:
        text: "Good morning"
    commands:
      - assertVisible: "Good morning"

- runFlow:
    when:
      visible:
        text: "Welcome back"
    commands:
      - tapOn:
          id: "worker-tab"
      - tapOn:
          id: "email-input"
      - inputText: "worker@test.com"
      - hideKeyboard
      - tapOn:
          id: "password-input"
      - inputText: "Test@1234"
      - hideKeyboard
      - tapOn:
          id: "passport-input"
      - inputText: "TEST123456"
      - hideKeyboard
      - tapOn:
          id: "sign-in-btn"
      - waitForAnimationToEnd

- assertVisible: "Good morning"
