# TC-M-01a — Worker login → reach the Home dashboard
appId: com.jd12345.MobileApp
---
- launchApp

# Wait for the app to finish loading (splash + Metro) before probing screen state.
- extendedWaitUntil:
    visible: "At a glance|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible:
        text: "At a glance"
    commands:
      - assertVisible: "At a glance"

- runFlow:
    when:
      visible:
        text: "Welcome back"
    commands:
      - tapOn:
          id: "worker-tab"
      - tapOn:
          id: "email-input"
      - inputText: "worker@test.com"
      - hideKeyboard
      - tapOn:
          id: "password-input"
      - inputText: "Test@1234"
      - hideKeyboard
      - tapOn:
          id: "passport-input"
      - inputText: "TEST123456"
      - hideKeyboard
      - tapOn:
          id: "sign-in-btn"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "At a glance"
    timeout: 30000
