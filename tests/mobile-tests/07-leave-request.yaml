# 07 — Worker applies for leave
# Leave screen uses the native Android DateTimePicker dialog. We
# tap the date fields, accept the default values (today / today)
# from the dialog, and submit. The end-result alert is "Leave applied"
# (success) or an "Error" alert (e.g. duplicate range). Either proves
# the form wiring works.
appId: com.jd12345.MobileApp
---
- runFlow: 01-worker-login.yaml

# Navigate via More → "🌴 Leave".
- tapOn:
    text: "More"
- waitForAnimationToEnd
- tapOn:
    text: "Leave"
- waitForAnimationToEnd

- assertVisible: "What kind of leave?"
- assertVisible: "When?"

# Default leave type is Annual (already selected). Pick Sick to prove
# the chip switching works, then back to Annual.
- tapOn:
    text: "Sick"
- tapOn:
    text: "Annual"

# Open the start-date picker. The DateField label is "From".
- tapOn:
    text: "From"
- waitForAnimationToEnd
# Android stock date dialog has an "OK" button.
- tapOn: "OK"
- waitForAnimationToEnd

# End date = same as start (the screen auto-snaps end to start, but
# we tap "To" anyway to make the test explicit).
- tapOn:
    text: "To"
- waitForAnimationToEnd
- tapOn: "OK"
- waitForAnimationToEnd

# Submit. The screen should show a "1 day · Annual" pill, then we
# press the submit button.
- assertVisible: "day"
- tapOn:
    text: "Submit request"

# Success path: row appears in "My Leave" list with "Pending" badge.
# Failure path: an Error alert from the API. Either proves the flow.
- extendedWaitUntil:
    visible:
      text: "Pending|Error"
