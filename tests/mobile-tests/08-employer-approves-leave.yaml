# 08 — Employer reviews leave requests
# Employer logs in and opens More → Leave. Approve/Reject UI shows
# only when there is a Pending row from the worker side. If the
# inbox is empty, we still assert the Leave screen rendered for the
# manager view (subtitle: "Approve or reject pending leave").
appId: com.jd12345.MobileApp
---
- runFlow: 02-employer-login.yaml

# Navigate to Leave via More.
- tapOn:
    text: "More"
- waitForAnimationToEnd
- tapOn:
    text: "Leave"
- waitForAnimationToEnd

# Manager subtitle is "Approve or reject pending leave".
- assertVisible: "Leave Requests"

# If at least one Pending row exists, approve the first.
- runFlow:
    when:
      visible:
        text: "Pending"
    commands:
      - tapOn:
          text: "Approve"
      - extendedWaitUntil:
          visible:
            text: "Approved"
