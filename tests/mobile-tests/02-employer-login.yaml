# TC-M-01b — Employer login → reach the Employer dashboard
appId: com.jd12345.MobileApp
---
- launchApp

- extendedWaitUntil:
    visible: "At a glance|Welcome back"
    timeout: 60000

- runFlow:
    when:
      visible:
        text: "At a glance"
    commands:
      - assertVisible: "At a glance"

- runFlow:
    when:
      visible:
        text: "Welcome back"
    commands:
      - tapOn:
          id: "employer-tab"
      - tapOn:
          id: "email-input"
      - inputText: "employer@test.com"
      - hideKeyboard
      - tapOn:
          id: "password-input"
      - inputText: "Test@1234"
      - hideKeyboard
      - tapOn:
          id: "sign-in-btn"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "At a glance"
    timeout: 30000
