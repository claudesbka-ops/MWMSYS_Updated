# 05 — Worker submits a salary dispute (no proof file)
# Disputes screen lives at /disputes (top-level) and is reachable from
# the More hub on mobile. Form fields match by placeholder text.
appId: com.jd12345.MobileApp
---
- runFlow: 01-worker-login.yaml

# Navigate via the More tab → "⚖️ Salary disputes" entry.
- tapOn:
    text: "More"
- waitForAnimationToEnd
- tapOn:
    text: "Salary disputes"
- waitForAnimationToEnd

- assertVisible: "Submit a salary dispute"

# Month — placeholder is "e.g. 2025-01 or January 2025".
- tapOn:
    text: "e.g. 2025-01 or January 2025"
- inputText: "2025-09"
- hideKeyboard

# Expected/Received are siblings; tap their labels first to open the
# correct field. Decimal-pad keyboard is shown.
- tapOn:
    text: "Expected (RM)"
- tapOn:
    below: "Expected (RM)"
- inputText: "3500"
- hideKeyboard

- tapOn:
    text: "Received (RM)"
- tapOn:
    below: "Received (RM)"
- inputText: "2800"
- hideKeyboard

- tapOn:
    text: "Describe the issue clearly so it can be routed properly"
- inputText: "Maestro QA — short paid by 700 in September 2025"
- hideKeyboard

# Submit (no proof — proof is optional).
- tapOn:
    text: "Submit dispute"

# Success Alert title is "Submitted".
- extendedWaitUntil:
    visible:
      text: "Submitted"
- tapOn: "OK"

# The new row should appear at top of the list (Pending status).
- assertVisible: "Pending"
