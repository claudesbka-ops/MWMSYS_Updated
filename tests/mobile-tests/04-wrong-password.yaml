# TC-M-01d — Login with wrong password should show error and stay on login
appId: com.jd12345.MobileApp
---
- launchApp:
    clearState: true
    clearKeychain: true

- assertVisible: "Welcome back"

- tapOn:
    id: "worker-tab"
- tapOn:
    id: "email-input"
- inputText: "worker@test.com"
- hideKeyboard
- tapOn:
    id: "password-input"
- inputText: "WrongPass123"
- hideKeyboard
- tapOn:
    id: "passport-input"
- inputText: "TEST123456"
- hideKeyboard
- tapOn:
    id: "sign-in-btn"

# Expect either a "Login failed" alert or remain on the login screen.
- extendedWaitUntil:
    visible: "Login failed|Invalid|Welcome back"

# Dismiss possible alert and confirm still on login.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- assertVisible: "Welcome back"
