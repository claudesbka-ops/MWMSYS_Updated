# TC-M-03b — Employer views dispute list and sees review affordances
appId: com.jd12345.MobileApp
---
- runFlow: 02-employer-login.yaml

# Navigate via More → Salary disputes
- tapOn:
    id: "nav-more"
- waitForAnimationToEnd
- tapOn:
    id: "more-disputes"
- waitForAnimationToEnd

# Disputes screen is visible
- assertVisible: "Disputes"

# At least one of the review affordances or the empty state should be
# present. We accept either as evidence the screen rendered with the
# employer-scoped data.
- assertVisible: "Pending|Accepted|Rejected|No disputes"
