# TC-M-01c — Agency login → reach the Agency dashboard
appId: com.jd12345.MobileApp
---
- launchApp

- runFlow:
    when:
      visible:
        text: "Good morning"
    commands:
      - assertVisible: "Good morning"

- runFlow:
    when:
      visible:
        text: "Welcome back"
    commands:
      - tapOn:
          id: "agency-tab"
      - tapOn:
          id: "email-input"
      - inputText: "agency@test.com"
      - hideKeyboard
      - tapOn:
          id: "password-input"
      - inputText: "Test@1234"
      - hideKeyboard
      - tapOn:
          id: "sign-in-btn"
      - waitForAnimationToEnd

- assertVisible: "Good morning"
